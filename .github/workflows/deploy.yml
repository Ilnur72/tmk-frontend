name: Build check

# Deploy hozircha qo'lda bajariladi: serverda git pull + npm run build.
# Sabab: GitHub runner'lari serverning SSH portiga ulana olmaydi —
# provayder bulut IP diapazonlarini filtrlaydi (serverda firewall yo'q,
# ufw o'chiq, iptables bo'sh). Shu bois scp qadami olib tashlandi.
#
# Bu workflow faqat kod build bo'lishini tekshiradi.

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
